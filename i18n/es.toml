[profile_dwm_note]
other = "Perfil dwm: el modificador es Alt, como en dwm, no Super. Algunos atajos de las apps con Alt (como Alt+F, que abre el menú Archivo) ya no llegan a las apps. Solo aquí cambian dos atajos: las tarjetas de ventanas (Alt+Tab y Alt+Shift+Tab en los otros perfiles) pasan a Super+Tab y Super+Shift+Tab, porque Alt+Tab vuelve al último espacio de trabajo; y el lanzador (Alt+Espacio) pasa a Super+Espacio, porque Alt+Espacio cambia la disposición de las ventanas. Las acciones de Swaydesk que dwm no tiene (notificaciones, portapapeles, búsqueda de ventanas, captura y grabación) se quedan en Super. Ventanas flotantes con el ratón: Alt+arrastrar. La distribución del teclado: Super+Ctrl+Espacio."

