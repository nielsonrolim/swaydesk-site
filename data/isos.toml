# The Download page (shortcodes isos/iso). One place for both languages.
# The files are assets of the GitHub Release `tag` in params.code_repo, with `sums` (SHA-256 only) next to them.
# Per ISO:
#   published = false -> the card and its notes disappear from the page (an ISO that wasn't attached to the
#                        Release, such as one over 2 GiB). Nothing else on the page names a single ISO.
#   published = true  -> a card; while size or sha256 is empty it says "coming soon" and has no link.
# The sha256 comes from the Release's SHA256SUMS, copied here for the card. It catches a corrupted download;
# it is not a signature (site and Release are published from the same GitHub account). Fill size and sha256
# only once the ISO is in the Release.
# An ISO may carry its own `tag` (an older Release, while its new image isn't out yet): its link and its
# SHA256SUMS link use that Release, and the card says the image updates to the version of the top `tag`.
# When that ISO catches up, drop its `tag` AND the sentence about it in content/*/download.md (first paragraph).
tag = "v0.1.6.1"
sums = "SHA256SUMS"

[debian]
published = true
name = "Debian 13"
file = "swaydesk-0.1.6.1-debian13-amd64.iso"
size = ""
sha256 = ""
secure_boot = true

[arch]
published = true
name = "Arch Linux"
file = "swaydesk-0.1.6.1-arch-x86_64.iso"
size = ""
sha256 = ""
secure_boot = false
