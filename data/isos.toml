# The Download page (shortcodes isos/iso). One place for both languages.
# The files are assets of the GitHub Release `tag` in params.code_repo (nielsonrolim/swaydesk), made by
# packaging/release-isos.sh in sway-desktop, with `sums` (SHA-256 only) next to them.
# Per ISO:
#   published = false -> the card and its notes disappear from the page (an ISO that wasn't attached to the
#                        Release, such as one over 2 GiB). Nothing else on the page names a single ISO.
#   published = true  -> a card; while size or sha256 is empty it says "coming soon" and has no link.
# The sha256 comes from the Release's SHA256SUMS, copied here for the card. It catches a corrupted download;
# it is not a signature (site and Release are published from the same GitHub account).
# Before publishing (coordinator, 16/11; builder3's checklist): the published ISOs in the Release, with size and
# SHA-256 here; the login notice of swaydesk-extras (sway-desktop #188, wording after #224; Ubuntu with the
# Error-Mode fix) in each ISO, Arch included; and its VM test in each: offline with the codecs box -> the
# notice; "sudo swaydesk-extras" with network -> it goes away; without the box -> nothing.
# Then it goes live only on the coordinator's signal.
tag = "v0.1.1"
sums = "SHA256SUMS"

[debian]
published = true
name = "Debian 13"
file = "swaydesk-0.1.1-debian13-amd64.iso"
size = "1.8 GB"
sha256 = "9bbab20fb112c77d6a1b91e9a00f5e2f3bb0837d5b69b6842b944007f5a238ad"
secure_boot = true

[ubuntu]
published = true
name = "Ubuntu 26.04"
file = "swaydesk-0.1.1-ubuntu26.04-amd64.iso"
size = "1.9 GB"
sha256 = "1930fd51976a0ea85acb43fe2c210a098a589bc6af7b40bf867a3d4c92297ec7"
secure_boot = true

[arch]
published = true
name = "Arch Linux"
file = "swaydesk-0.1.1-arch-x86_64.iso"
size = "1.8 GB"
sha256 = "bb551dc4d041dd395303e8672f984817b1a1914a271f075a253bed9e785f2607"
secure_boot = false
