    "Dois interruptores ligam e desligam o Wi-Fi e toda a rede (*Rede*).",
    "A lista de Wi-Fi mostra a conectada primeiro, depois as salvas, depois as de sinal mais forte; as protegidas têm um cadeado.",
    "Clique numa rede para conectar; *×* desconecta, ou cancela uma conexão em andamento.",
    "Clique na rede conectada para ver os detalhes: IP, gateway, DNS, sinal, faixa e velocidade; *Voltar* ou `Esc` volta.",
    "As VPNs conectam com um clique; *Adicionar VPN* cria uma, dos tipos que os plugins de VPN do NetworkManager instalados permitem.",
    "*Rede oculta*, *Editar conexões* e o *clique do meio* no ícone abrem o editor de conexões.",
    "Com o NetworkManager, a senha de uma rede nova é pedida pelo nm-applet ou pelo agente do sistema.",
    "O ícone mostra o sinal do Wi-Fi, o cabo ou a VPN, e fica laranja sem acesso à internet.",
    "Funciona também com o iwd e o systemd-networkd; a VPN precisa do NetworkManager.",
    "Sem placa de Wi-Fi (um PC só com cabo), o interruptor do Wi-Fi fica desativado e a lista diz *Nenhuma placa de Wi-Fi*; uma placa espetada depois funciona sem reabrir o popup.",
  ]
  keys = "Clique no ícone de rede"
  guide = "guide/desktop/#a-barra"
  [components.en-us]
  name = "Network"
  text = "Wi-Fi, wired and VPN: turn them on and off, connect and see the details."
  features = [
    "Two switches turn Wi-Fi and all networking (*Network*) on and off.",
    "Wi-Fi networks list the connected one first, then saved ones, then the strongest; secured ones show a lock.",
    "Click a network to connect; *×* disconnects, or cancels a connection in progress.",
    "Click the connected network for its details: IP, gateway, DNS, signal, band and speed; *Back* or `Esc` returns.",
    "VPNs connect with a click; *Add VPN* adds one, of the types your installed NetworkManager VPN plugins allow.",
    "*Hidden network*, *Edit connections* and a *middle click* on the icon open the connection editor.",
    "With NetworkManager, the password for a new network is asked by nm-applet or the system's agent.",
    "The icon shows the Wi-Fi signal, cable or VPN, and turns orange without internet access.",
    "Also works with iwd and systemd-networkd; VPNs need NetworkManager.",
    "Without a Wi-Fi card (a wired-only PC), the Wi-Fi switch is disabled and the list says *No Wi-Fi adapter*; a card plugged in later works without reopening the popup.",
  ]
  keys = "Click the network icon"
  guide = "guide/desktop/#the-bar"
  [components.es]
  name = "Red"
  text = "Wi-Fi, red cableada y VPN: actívalas y desactívalas, conéctate y mira los detalles."
  features = [
    "Dos interruptores activan y desactivan el Wi-Fi y toda la red (*Red*).",
    "La lista de Wi-Fi muestra primero la conectada, luego las guardadas y luego las de señal más fuerte; las protegidas llevan un candado.",
    "Haz clic en una red para conectarte; *×* desconecta, o cancela una conexión en curso.",
    "Haz clic en la red conectada para ver sus detalles: IP, puerta de enlace, DNS, señal, banda y velocidad; *Atrás* o `Esc` vuelve.",
    "Las VPN se conectan con un clic; *Añadir VPN* añade una, de los tipos que permiten los plugins de VPN de NetworkManager instalados.",
    "*Red oculta*, *Editar conexiones* y el *clic central* en el icono abren el editor de conexiones.",
    "Con NetworkManager, la contraseña de una red nueva la pide nm-applet o el agente del sistema.",
    "El icono muestra la señal del Wi-Fi, el cable o la VPN, y se pone naranja sin acceso a internet.",
    "También funciona con iwd y systemd-networkd; la VPN necesita NetworkManager.",
    "Sin tarjeta Wi-Fi (un PC solo con cable), el interruptor del Wi-Fi queda desactivado y la lista dice *No hay adaptador Wi-Fi*; una tarjeta conectada después funciona sin reabrir la ventana emergente.",
  ]
  keys = "Haz clic en el icono de red"
  guide = "guide/desktop/#la-barra"

