start = ""
  [components.pt-br]
  name = "Tema do Desktop"
  text = "Escolhe o tema GTK, os ícones, a cor de destaque e o tamanho do cursor, e aplica tudo de uma vez, também nos apps GTK e libadwaita. Por padrão, a cor de destaque acompanha o papel de parede, inclusive o do dia (**Usar a cor do papel de parede**); escolher uma cor à mão desliga isso."
  features = [
    "Os temas vêm agrupados por família (Mint-Y, Mint-L, Mint-X, Adwaita, adw-gtk3, Yaru), depois os outros; digitar filtra a lista.",
    "Um clique mostra o tema numa prévia ao vivo do desktop; *Aplicar*, `Enter` ou um clique duplo o aplica.",
    "*Estilo*: *Claro* ou *Escuro*, com um aviso quando o tema só tem um deles.",
    "*Ícones* lista os temas de ícones instalados, cada um com uma faixa de ícones de exemplo.",
    "*Tamanho do cursor* oferece os tamanhos que o tema do cursor tem e aplica na hora, sem *Aplicar*.",
    "As amostras de *Cor de destaque* são as cores do Papirus; com os ícones Papirus, as pastas ficam na mesma cor.",
    "Ao lado de *Usar a cor do papel de parede*, um ponto mostra a cor que ele escolheria agora.",
    "*Será aplicado:* resume a mudança antes de aplicar; *Voltar ao tema em uso* desfaz a seleção.",
    "Quando o tema escolhido não está instalado, o desktop usa o adw-gtk3-dark, ou o Adwaita-dark sem o adw-gtk-theme.",
    "A cor de destaque também vai para os interruptores, botões principais, caixas de seleção, controles deslizantes e linhas selecionadas dos apps do Swaydesk; um `~/.config/gtk-4.0/gtk.css` seu continua valendo mais.",
    "As janelas abertas do Swaydesk, este app incluído, trocam de *Claro* para *Escuro* (e de volta) na hora.",
    "O estilo em uso, *Claro* ou *Escuro*, aparece marcado na cor de destaque.",
  ]
  keys = "Na grade de apps"
  guide = "guide/config/"
  start_text = "Nada a acrescentar à config do Sway: abra o **Tema do Desktop** pelo seu lançador, ou rode `swaydesk-theme-app`."
  note = "Também está nas [Configurações](/pt-br/components/settings/), como o painel **Aparência**: a mesma página, sem abrir outra janela."
