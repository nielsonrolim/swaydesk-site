  [components.en-us]
  name = "Screenshot"
  text = "A region, the whole screen or a window, with a delay. It goes to the clipboard and to `~/Pictures/Screenshots`; with Gradia, it opens for editing."
  keys = "`Super`+`Shift`+`E`; `Print`"
  guide = "guide/desktop/#screenshots-and-recording"
  start_note = "`swaydesk-capture rec` opens the recording panel instead; bind it to another key if you like. Both also open from your launcher."
  [components.es]
  name = "Captura de pantalla"
  text = "Una región, la pantalla completa o una ventana, con retardo. Va al portapapeles y a `~/Pictures/Screenshots`; con Gradia, se abre para editarla."
  keys = "`Super`+`Shift`+`E`; `Print`"
  guide = "guide/desktop/#capturas-de-pantalla-y-grabación"
  start_note = "`swaydesk-capture rec` abre el panel de grabación; asígnalo a otra tecla si quieres. Los dos también se abren desde tu lanzador."

