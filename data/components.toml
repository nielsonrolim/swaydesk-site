[[components]]
id = "settings"
group = "apps"
icon = "sliders"
shot = "settings"
crop = true
more_shots = ["settings-keyboard", "settings-default-apps", "settings-region"]
bin = "swaydesk-settings"
src = "rust/settings"
tech = "rust"
off = ""
page = true
package = "swaydesk-settings"
arch_with = ["hwdata", "swaydesk-theme-tool", "swaydesk-displays", "swaydesk-caffeine"]
optional = ["blueman", "pavucontrol", "power-profiles-daemon"]
start = ""
  [components.pt-br]
  name = "Configurações"
  text = "Uma janela só, com um painel para cada parte do desktop numa barra lateral: **Aparência**, **Telas**, **Teclado**, **Mouse e touchpad**, **Energia e bloqueio**, **Desktop**, **Apps padrão**, **Região** e **Sobre**. Cada painel grava só as chaves dele, nos mesmos arquivos que você editaria à mão, e mantém os seus comentários."
  more_alts = [
    "O painel Teclado, com dois layouts na ordem em que o Super+Espaço os troca",
    "O painel Apps padrão, com o navegador, o e-mail e os visualizadores de cada tipo de arquivo",
    "O painel Região, com o idioma, a cidade da previsão do tempo e o país dos feriados",
  ]
  shot_caption = "O painel Desktop: os componentes da sessão e os módulos da barra"
  features = [
    "*Aparência* e *Telas* são as páginas dos apps [Tema do Desktop](/pt-br/components/theme/) e [Telas](/pt-br/components/displays/), que continuam apps próprios, cada um com o seu pacote; cada painel aparece só com o app dele instalado.",
    "*Teclado*: os layouts e a ordem deles, a *Tecla de troca*, o atraso e a velocidade da repetição e o *Num Lock ligado* no login; *Usar o teclado do sistema* volta ao teclado da instalação. A tela de login sempre usa o do sistema.",
    "*Mouse e touchpad*: a velocidade, a *Rolagem natural* e o modo *Canhoto*; com um touchpad, também *Tocar para clicar* e *Desligar ao digitar*. Mostra os valores que o Sway aplica agora.",
    "Teclado e mouse valem na hora e vão para `~/.config/sway/config.d/80-input.conf`, que vem depois do `50-local.conf` e vale mais que ele.",
    "*Energia e bloqueio*: depois de quanto tempo bloquear a tela, apagá-la e suspender (na bateria), de *Nunca* a 60 minutos, valendo na hora; com o `power-profiles-daemon`, também o *Perfil de energia*.",
    "*Desktop* liga e desliga os componentes da sessão e os módulos da barra, escolhe o *Perfil de atalhos* e diz se cada mudança vale na hora ou no próximo login; mostra o que vem do `/etc/swaydesk/config.toml` e o que não está instalado.",
    "*Apps padrão*: o navegador, o e-mail, o editor de texto, as imagens, o PDF, o vídeo e a música no seu `~/.config/mimeapps.list`, e o gerenciador de arquivos e o terminal no `config.toml`; o padrão do sistema aparece e nunca é sobrescrito.",
    "*Região*: o idioma (no próximo login), a cidade da previsão do tempo e o país dos feriados; um campo vazio volta ao automático.",
    "*Sobre*: a distribuição, o kernel, o Sway, o processador, a memória, a placa de vídeo e o disco, com *Copiar informações* para relatar um problema (em inglês, sem o nome do aparelho).",
    "*Rede*, *Bluetooth* e *Som* aparecem quando o `nm-connection-editor`, o Blueman ou o pavucontrol estão instalados, e os abrem.",
    "`swaydesk-settings --panel keyboard` abre num painel (`appearance`, `displays`, `keyboard`, `mouse`, `power`, `desktop`, `default-apps`, `region`, `about`); com a janela aberta, troca o painel dela. `--about` imprime o texto do *Copiar informações* no terminal.",
  ]
  keys = "Na grade de apps, como **Configurações**"
  guide = "guide/config/"
  start_text = "Nada a acrescentar à config do Sway: abra as **Configurações** pelo seu lançador, ou rode `swaydesk-settings`. `man swaydesk-settings` tem os detalhes."
  [components.en-us]
  name = "Settings"
  text = "One window with a panel for each part of the desktop in a sidebar: **Appearance**, **Displays**, **Keyboard**, **Mouse and touchpad**, **Power and lock**, **Desktop**, **Default apps**, **Region** and **About**. Each panel writes only its own keys, in the same files you'd edit by hand, and keeps your comments."
  more_alts = [
    "The Keyboard panel, with two layouts in the order Super+Space switches them",
    "The Default apps panel, with the browser, mail and the viewers for each kind of file",
    "The Region panel, with the language, the weather city and the holidays country",
  ]
  shot_caption = "The Desktop panel: the session's components and the bar's modules"
  features = [
    "*Appearance* and *Displays* are the pages of the [Desktop Theme](/en-us/components/theme/) and [Displays](/en-us/components/displays/) apps, which stay apps of their own, each with its own package; each panel shows up only with its app installed.",
    "*Keyboard*: the layouts and their order, the *Switch key*, the repeat delay and rate, and *Num Lock on* at login; *Use the system keyboard* goes back to the keyboard set at install. The login screen always uses the system one.",
    "*Mouse and touchpad*: the speed, *Natural scrolling* and *Left-handed*; with a touchpad, also *Tap to click* and *Disable while typing*. It shows the values Sway applies now.",
    "Keyboard and mouse changes apply at once and go into `~/.config/sway/config.d/80-input.conf`, which comes after `50-local.conf` and wins over it.",
    "*Power and lock*: how long before the screen locks, turns off and the computer suspends (on battery), from *Never* to 60 minutes, applied at once; with `power-profiles-daemon`, also the *Power profile*.",
    "*Desktop* turns the session's components and the bar's modules on and off, picks the *Shortcut profile* and says whether each change applies at once or at the next login; it shows what comes from `/etc/swaydesk/config.toml` and what isn't installed.",
    "*Default apps*: the browser, mail, text editor, images, PDF, video and music in your `~/.config/mimeapps.list`, and the file manager and terminal in `config.toml`; the system default is shown and never overwritten.",
    "*Region*: the language (at the next login), the weather city and the holidays country; an empty field goes back to automatic.",
    "*About*: the distribution, kernel, Sway, processor, memory, graphics and disk, with *Copy info* for a bug report (in English, without the device name).",
    "*Network*, *Bluetooth* and *Sound* show up when `nm-connection-editor`, Blueman or pavucontrol are installed, and open them.",
    "`swaydesk-settings --panel keyboard` opens on a panel (`appearance`, `displays`, `keyboard`, `mouse`, `power`, `desktop`, `default-apps`, `region`, `about`); with the window open, it switches that window's panel. `--about` prints the *Copy info* text in the terminal.",
  ]
  keys = "In the app grid, as **Settings**"
  guide = "guide/config/"
  start_text = "Nothing to add to the Sway config: open **Settings** from your launcher, or run `swaydesk-settings`. `man swaydesk-settings` has the details."
  [components.es]
  name = "Configuración"
  text = "Una sola ventana, con un panel para cada parte del escritorio en una barra lateral: **Apariencia**, **Pantallas**, **Teclado**, **Ratón y panel táctil**, **Energía y bloqueo**, **Escritorio**, **Aplicaciones predeterminadas**, **Región** y **Acerca de**. Cada panel escribe solo sus propias claves, en los mismos archivos que editarías a mano, y conserva tus comentarios."
  more_alts = [
    "El panel Teclado, con dos distribuciones en el orden en que Super+Espacio las alterna",
    "El panel Aplicaciones predeterminadas, con el navegador, el correo y los visores de cada tipo de archivo",
    "El panel Región, con el idioma, la ciudad del tiempo y el país de los festivos",
  ]
  shot_caption = "El panel Escritorio: los componentes de la sesión y los módulos de la barra"
  features = [
    "*Apariencia* y *Pantallas* son las páginas de las aplicaciones [Tema del escritorio](/es/components/theme/) y [Pantallas](/es/components/displays/), que siguen siendo aplicaciones propias, cada una con su paquete; cada panel aparece solo con su aplicación instalada.",
    "*Teclado*: las distribuciones y su orden, la *Tecla de cambio*, el retardo y la velocidad de repetición y *Bloq Num activado* al iniciar sesión; *Usar el teclado del sistema* vuelve al teclado de la instalación. La pantalla de inicio de sesión siempre usa el del sistema.",
    "*Ratón y panel táctil*: la velocidad, el *Desplazamiento natural* y el modo *Zurdo*; con un panel táctil, también *Tocar para hacer clic* y *Desactivar al escribir*. Muestra los valores que Sway aplica ahora.",
    "Los cambios de teclado y ratón se aplican al instante y van a `~/.config/sway/config.d/80-input.conf`, que viene después de `50-local.conf` y tiene prioridad sobre él.",
    "*Energía y bloqueo*: cuánto tiempo antes de bloquear la pantalla, apagarla y suspender (con batería), de *Nunca* a 60 minutos, aplicado al instante; con `power-profiles-daemon`, también el *Perfil de energía*.",
    "*Escritorio* activa y desactiva los componentes de la sesión y los módulos de la barra, elige el *Perfil de atajos* y dice si cada cambio se aplica al instante o en el próximo inicio de sesión; muestra lo que viene de `/etc/swaydesk/config.toml` y lo que no está instalado.",
    "*Aplicaciones predeterminadas*: el navegador, el correo, el editor de texto, las imágenes, el PDF, el vídeo y la música en tu `~/.config/mimeapps.list`, y el gestor de archivos y la terminal en `config.toml`; el predeterminado del sistema se muestra y nunca se sobrescribe.",
    "*Región*: el idioma (en el próximo inicio de sesión), la ciudad del tiempo y el país de los festivos; un campo vacío vuelve a lo automático.",
    "*Acerca de*: la distribución, el kernel, Sway, el procesador, la memoria, la tarjeta gráfica y el disco, con *Copiar información* para informar de un problema (en inglés, sin el nombre del equipo).",
    "*Red*, *Bluetooth* y *Sonido* aparecen cuando `nm-connection-editor`, Blueman o pavucontrol están instalados, y los abren.",
    "`swaydesk-settings --panel keyboard` abre en un panel (`appearance`, `displays`, `keyboard`, `mouse`, `power`, `desktop`, `default-apps`, `region`, `about`); con la ventana abierta, cambia su panel. `--about` imprime el texto de *Copiar información* en la terminal.",
  ]
  keys = "En la cuadrícula de aplicaciones, como **Configuración**"
  guide = "guide/config/"
  start_text = "Nada que añadir a la config de Sway: abre **Configuración** desde tu lanzador, o ejecuta `swaydesk-settings`. `man swaydesk-settings` tiene los detalles."

