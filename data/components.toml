[[components]]
id = "desktop-config"
group = "apps"
icon = "theme"
shot = ""
bin = "swaydesk-desktop-config"
src = "rust/desktop-config"
tech = "Rust"
off = ""
page = true
package = "swaydesk-theme-tool"
arch_with = ["papirus-icon-theme", "dconf", "gnome-themes-extra"]
optional = []
start = ""
  [components.pt-br]
  name = "Tema e configurações pelo terminal"
  text = "Aplica o tema GTK, os ícones, a cor de destaque e as fontes em todo o desktop pela linha de comando, com as cores de pasta do Papirus (`swaydesk-theme`), e gera, do `~/.config/swaydesk/config.toml`, os arquivos que o Sway, a barra e os apps usam: depois de editar o arquivo à mão, `swaydesk-desktop-config apply` grava tudo e recarrega o Sway; `swaydesk-desktop-config generate` só grava os arquivos."
  keys = "No terminal"
  guide = "guide/config/"
  start_text = "Nada a acrescentar à config do Sway: são ferramentas de linha de comando. `man swaydesk-theme` e `man swaydesk-desktop-config` listam as opções."
  [components.en-us]
  name = "Theme and settings from the terminal"
  text = "Applies the GTK theme, the icons, the accent color and the fonts across the desktop from the command line, with the Papirus folder colors (`swaydesk-theme`), and writes, from `~/.config/swaydesk/config.toml`, the files that Sway, the bar and the apps use: after editing the file by hand, `swaydesk-desktop-config apply` writes everything and reloads Sway; `swaydesk-desktop-config generate` only writes the files."
  keys = "In the terminal"
  guide = "guide/config/"
  start_text = "Nothing to add to the Sway config: they're command-line tools. `man swaydesk-theme` and `man swaydesk-desktop-config` list their options."
  [components.es]
  name = "Tema y ajustes desde la terminal"
  text = "Aplica el tema GTK, los iconos, el color de acento y las fuentes en todo el escritorio desde la línea de comandos, con los colores de carpeta de Papirus (`swaydesk-theme`), y escribe, desde `~/.config/swaydesk/config.toml`, los archivos que usan Sway, la barra y las aplicaciones: después de editar el archivo a mano, `swaydesk-desktop-config apply` escribe todo y recarga Sway; `swaydesk-desktop-config generate` solo escribe los archivos."
  keys = "En la terminal"
  guide = "guide/config/"
  start_text = "Nada que añadir a la config de Sway: son herramientas de línea de comandos. `man swaydesk-theme` y `man swaydesk-desktop-config` listan sus opciones."

