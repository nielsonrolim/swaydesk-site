    "Recuerda la última cuenta y la sesión que usó cada cuenta.",
    "Una lista de sesiones con las sesiones Wayland instaladas, la de Swaydesk primero.",
    "Cualquier fallo al iniciar sesión sacude el campo y muestra el motivo, como *Contraseña incorrecta*.",
    "Avisa cuando Bloq Mayús está activado.",
    "Los pasos adicionales que pide el sistema, como un código o una contraseña nueva, llegan uno a uno.",
    "Usa el idioma y el teclado del sistema; un botón en la esquina muestra la distribución, y un clic la cambia.",
    "Botones *Suspender*, *Reiniciar* y *Apagar* abajo a la derecha.",
    "Reloj y fecha en cada monitor; la tarjeta del formulario está en un solo monitor, el de arriba a la izquierda.",
    "Al elegir una cuenta, la pantalla toma el color de acento que ese usuario eligió en Tema del escritorio (con `accountsservice`); sin él, o en \"Otro usuario…\", queda el color de `/etc/swaydesk-greeter/config.toml`.",
  ]
  keys = ""
  guide = "guide/first-steps/#la-pantalla-de-inicio-de-sesión-de-swaydesk"
  start_text = "Nada que añadir a la config de Sway: la pantalla de inicio de sesión funciona antes de Sway, con greetd.\n\n- **Debian y Ubuntu sin gestor de inicio de sesión:** aparece en el próximo arranque.\n- **Con otro gestor de inicio de sesión** (GDM, SDDM, LightDM), cambia a greetd y reinicia:\n\n  ```\n  sudo systemctl disable gdm3\n  sudo systemctl enable greetd\n  ```\n\n  Pon `sddm` o `lightdm` en lugar de `gdm3`, o `gdm` en Arch. En Arch, `sudo systemctl enable greetd` hace falta incluso sin otro.\n- **Para volver:** `sudo systemctl disable greetd`, activa de nuevo el anterior y reinicia."

