[[components]]
id = "desktop-config"
group = "apps"
icon = "terminal"
shot = ""
crop = true
bin = "swaydesk-desktop-config"
src = "rust/desktop-config"
tech = "Rust"
off = ""
page = true
package = "swaydesk-theme-tool"
arch_with = ["papirus-icon-theme", "dconf", "gnome-themes-extra"]
optional = []
start = ""
  [components.pt-br]
  name = "Tema e configurações pelo terminal"
  text = "Aplica o tema GTK, os ícones e a cor de destaque pela linha de comando (`swaydesk-theme`) e grava, do `~/.config/swaydesk/config.toml`, os arquivos que o Sway, a barra e os apps leem: depois de editá-lo à mão, rode `swaydesk-desktop-config apply`."
  features = [
    "`swaydesk-theme list`, `current`, `families` e `colors` mostram os temas instalados, o em uso e as cores de pasta do Papirus.",
    "`swaydesk-theme set` ou `pick` (família, claro ou escuro, cor) troca o tema, com `--accent`, `--folders` e `--icons` opcionais.",
    "`swaydesk-theme icons` e `cursor` trocam só o tema de ícones ou o tamanho do cursor (de 16 a 96).",
    "`swaydesk-theme accent-auto` aplica a cor do Papirus mais próxima da do papel de parede; `--print` só diz qual é.",
    "O `accent_auto` fica ligado quando vale true, ou quando está ausente e existe um arquivo de papel de parede.",
    "`generate` e `apply` também gravam a config da barra sem os módulos desligados, e sem o de atualizações com `update_notifier = false`.",
    "`swaydesk-desktop-config keys` monta os atalhos do perfil escolhido em `shortcuts`.",
    "`get`, `enabled` e `css` dão aos seus scripts um valor da config, se um componente está ligado ou as cores de destaque.",
    "Um `file_manager` vazio pega o primeiro instalado entre nemo, thunar, nautilus e dolphin, senão o thunar.",
    "As abas do Sway (grupos em abas e empilhados) são mais altas, com o título centralizado e um contorno, em três níveis da cor de destaque: a aba em foco nela, a visível de um grupo sem foco num tom mais escuro (mais claro no tema claro) e as outras em cinza. No Sway puro, o `50-swaydesk-theme-tool.conf` traz o mesmo visual, se você quiser.",
    "Os arquivos que ele gera começam com uma linha `Generated by sway-desktop-config: …`; um arquivo sem essa linha é seu, e fica como está.",
    "`cursor_theme` no `config.toml` escolhe o tema do cursor, e o `swaydesk-desktop-config apply` o aplica na hora (Sway, GTK, `gsettings`); sem a chave, fica o automático: Bibata no Debian e no Ubuntu, Capitaine no Arch.",
  ]
  keys = "No terminal"
  guide = "guide/config/"
  start_text = "Nada a acrescentar à config do Sway: são ferramentas de linha de comando. `man swaydesk-theme` e `man swaydesk-desktop-config` listam as opções."
  note = "Sem editar à mão: os painéis **Desktop**, **Região**, **Energia e bloqueio** e **Apps padrão** das [Configurações](/pt-br/components/settings/) gravam as mesmas chaves do `config.toml`, e mantêm os seus comentários."
  [components.en-us]
  name = "Theme and settings from the terminal"
  text = "Sets the GTK theme, the icons and the accent color from the terminal (`swaydesk-theme`), and writes the files Sway, the bar and the apps read from `~/.config/swaydesk/config.toml`: run `swaydesk-desktop-config apply` after editing it by hand."
  features = [
    "`swaydesk-theme list`, `current`, `families` and `colors` show the installed themes, the one in use and the Papirus folder colors.",
    "`swaydesk-theme set` or `pick` (family, light or dark, color) switches the theme, with optional `--accent`, `--folders` and `--icons`.",
    "`swaydesk-theme icons` and `cursor` change only the icon theme or the cursor size (16 to 96).",
    "`swaydesk-theme accent-auto` applies the wallpaper's nearest Papirus color; `--print` only names it.",
    "`accent_auto` is on when set to true, or when it's absent and there's a wallpaper file.",
    "`generate` and `apply` also write the bar's config without turned-off modules, and without updates when `update_notifier = false`.",
    "`swaydesk-desktop-config keys` sets up the shortcuts of the profile named in `shortcuts`.",
    "`get`, `enabled` and `css` give your own scripts a config value, a component's on/off state or the accent colors.",
    "An empty `file_manager` takes the first installed of nemo, thunar, nautilus and dolphin, else thunar.",
    "Sway's tabs (tabbed and stacked groups) are taller, with the title centred and an outline, in three accent levels: the focused tab in the accent, the visible tab of an unfocused group in a darker shade (lighter with a light theme), and the others in grey. On plain Sway, the opt-in `50-swaydesk-theme-tool.conf` brings the same look.",
    "The files it writes start with a `Generated by sway-desktop-config: …` line; a file without it is yours, and is left alone.",
    "`cursor_theme` in `config.toml` picks the cursor theme, and `swaydesk-desktop-config apply` applies it at once (Sway, GTK, `gsettings`); without the key, the automatic one stays: Bibata on Debian and Ubuntu, Capitaine on Arch.",
  ]
  keys = "In the terminal"
  guide = "guide/config/"
  start_text = "Nothing to add to the Sway config: they're command-line tools. `man swaydesk-theme` and `man swaydesk-desktop-config` list their options."
  note = "Without editing by hand: the **Desktop**, **Region**, **Power and lock** and **Default apps** panels of [Settings](/en-us/components/settings/) write the same `config.toml` keys, and keep your comments."
  [components.es]
  name = "Tema y ajustes desde la terminal"
  text = "Aplica el tema GTK, los iconos y el color de acento desde la línea de comandos (`swaydesk-theme`) y escribe, desde `~/.config/swaydesk/config.toml`, los archivos que leen Sway, la barra y las aplicaciones: después de editarlo a mano, ejecuta `swaydesk-desktop-config apply`."
  features = [
    "`swaydesk-theme list`, `current`, `families` y `colors` muestran los temas instalados, el que está en uso y los colores de carpeta de Papirus.",
    "`swaydesk-theme set` o `pick` (familia, claro u oscuro, color) cambia el tema, con `--accent`, `--folders` e `--icons` opcionales.",
    "`swaydesk-theme icons` y `cursor` cambian solo el tema de iconos o el tamaño del cursor (de 16 a 96).",
    "`swaydesk-theme accent-auto` aplica el color de Papirus más cercano al del fondo de pantalla; `--print` solo dice cuál es.",
    "`accent_auto` está activado cuando vale true, o cuando falta y existe un archivo de fondo de pantalla.",
    "`generate` y `apply` también escriben la config de la barra sin los módulos desactivados, y sin el de actualizaciones con `update_notifier = false`.",
    "`swaydesk-desktop-config keys` prepara los atajos del perfil elegido en `shortcuts`.",
    "`get`, `enabled` y `css` dan a tus scripts un valor de la config, si un componente está activado o los colores de acento.",
    "Un `file_manager` vacío toma el primero instalado entre nemo, thunar, nautilus y dolphin, si no, thunar.",
    "Las pestañas de Sway (grupos en pestañas y apilados) son más altas, con el título centrado y un contorno, en tres niveles del color de acento: la pestaña enfocada en él, la visible de un grupo sin foco en un tono más oscuro (más claro con un tema claro) y las demás en gris. En Sway sin Swaydesk, el `50-swaydesk-theme-tool.conf` opcional trae el mismo aspecto.",
    "Los archivos que escribe empiezan con una línea `Generated by sway-desktop-config: …`; un archivo sin ella es tuyo y se deja como está.",
    "`cursor_theme` en `config.toml` elige el tema del cursor, y `swaydesk-desktop-config apply` lo aplica al momento (Sway, GTK, `gsettings`); sin la clave, queda el automático: Bibata en Debian y Ubuntu, Capitaine en Arch.",
  ]
  keys = "En la terminal"
  guide = "guide/config/"
  start_text = "Nada que añadir a la config de Sway: son herramientas de línea de comandos. `man swaydesk-theme` y `man swaydesk-desktop-config` listan sus opciones."
  note = "Sin editar a mano: los paneles **Escritorio**, **Región**, **Energía y bloqueo** y **Aplicaciones predeterminadas** de [Configuración](/es/components/settings/) escriben las mismas claves de `config.toml`, y conservan tus comentarios."

[groups.bar]
