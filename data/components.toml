    "Ao escolher uma conta, a tela passa para a cor de destaque que esse usuário escolheu no Tema do Desktop (com o `accountsservice`); sem ele, ou em \"Outro usuário…\", fica a cor do `/etc/swaydesk-greeter/config.toml`.",
  ]
  keys = ""
  guide = "guide/first-steps/#a-tela-de-login-do-swaydesk"
  start_text = "Nada a acrescentar à config do Sway: a tela de login roda antes do Sway, pelo greetd.\n\n- **Debian e Ubuntu sem gerenciador de login:** ela aparece no próximo boot.\n- **Com outro gerenciador de login** (GDM, SDDM, LightDM), troque para o greetd e reinicie:\n\n  ```\n  sudo systemctl disable gdm3\n  sudo systemctl enable greetd\n  ```\n\n  Ponha `sddm` ou `lightdm` no lugar de `gdm3`, ou `gdm` no Arch. No Arch, o `sudo systemctl enable greetd` é preciso mesmo sem outro.\n- **Para voltar:** `sudo systemctl disable greetd`, ative de novo o anterior e reinicie."
