  name = "Desktop Theme"
  text = "Picks the GTK theme, the icons, the accent color and the cursor size, and applies them all at once, GTK and libadwaita apps included. By default the accent color follows the wallpaper, the daily one included (**Use the wallpaper's color**); picking a color yourself turns that off."
  features = [
    "Themes are grouped by family (Mint-Y, Mint-L, Mint-X, Adwaita, adw-gtk3, Yaru), then the others; typing filters the list.",
    "A click shows the theme in a live preview of the desktop; *Apply*, `Enter` or a double click applies it.",
    "*Style*: *Light* or *Dark*, with a note when a theme has only one of them.",
    "*Icons* lists the installed icon themes, each with a strip of sample icons.",
    "*Cursor size* offers the sizes the cursor theme has and applies at once, without *Apply*.",
    "*Accent color* swatches are the Papirus colors; with Papirus icons, the folders take the same color.",
    "Next to *Use the wallpaper's color*, a dot shows the color it would pick now.",
    "*Will apply:* sums up the change before you apply it; *Back to the theme in use* drops the selection.",
    "When the chosen theme isn't installed, the desktop uses adw-gtk3-dark, or Adwaita-dark without adw-gtk-theme.",
    "The accent color also reaches the switches, suggested buttons, checks, sliders and selected rows of the Swaydesk apps; a `~/.config/gtk-4.0/gtk.css` of your own still wins.",
    "Open Swaydesk windows, this app included, switch between *Light* and *Dark* right away.",
    "The style in use, *Light* or *Dark*, is shown selected in the accent color.",
  ]
  keys = "In the app grid"
  guide = "guide/config/"
  start_text = "Nothing to add to the Sway config: open **Desktop Theme** from your launcher, or run `swaydesk-theme-app`."
  note = "It's also in [Settings](/en-us/components/settings/), as the **Appearance** panel: the same page, without another window."
  [components.es]
  name = "Tema del escritorio"
  text = "Elige el tema GTK, los iconos, el color de acento y el tamaño del cursor, y los aplica todos a la vez, incluidas las aplicaciones GTK y libadwaita. De forma predeterminada, el color de acento sigue al fondo de pantalla, incluido el del día (**Usar el color del fondo de pantalla**); elegir un color tú mismo lo desactiva."
  features = [
    "Los temas vienen agrupados por familia (Mint-Y, Mint-L, Mint-X, Adwaita, adw-gtk3, Yaru), luego los demás; escribir filtra la lista.",
    "Un clic muestra el tema en una vista previa en vivo del escritorio; *Aplicar*, `Enter` o un doble clic lo aplica.",
    "*Estilo*: *Claro* u *Oscuro*, con un aviso cuando el tema solo tiene uno de ellos.",
    "*Iconos* lista los temas de iconos instalados, cada uno con una tira de iconos de ejemplo.",
    "*Tamaño del cursor* ofrece los tamaños que tiene el tema del cursor y se aplica al momento, sin *Aplicar*.",
    "Las muestras de *Color de acento* son los colores de Papirus; con los iconos Papirus, las carpetas toman el mismo color.",
    "Junto a *Usar el color del fondo de pantalla*, un punto muestra el color que elegiría ahora.",
    "*Se aplicará:* resume el cambio antes de aplicarlo; *Volver al tema en uso* descarta la selección.",
    "Cuando el tema elegido no está instalado, el escritorio usa adw-gtk3-dark, o Adwaita-dark sin adw-gtk-theme.",
    "El color de acento también llega a los interruptores, botones principales, casillas, deslizadores y filas seleccionadas de las aplicaciones de Swaydesk; un `~/.config/gtk-4.0/gtk.css` tuyo sigue teniendo prioridad.",
    "Las ventanas abiertas de Swaydesk, esta aplicación incluida, cambian entre *Claro* y *Oscuro* al momento.",
    "El estilo en uso, *Claro* u *Oscuro*, aparece marcado en el color de acento.",
