# The Components page (the list) and one page per component (content/<lang>/components/_content.gotmpl), in the three
# languages. One [[components]] per component, in the list's order.
#   id        the page's URL (/<lang>/components/<id>/) and the key for everything else
#   group     the list's section: bar, windows, session or apps (titles in i18n: components_group_<group>)
#   icon      the stroke icon in layouts/_partials/icon.html
#   shot      an image in assets/images/shots (no .webp); empty = no screenshot
#   bin, src, tech, off   as in the old {{< component >}} shortcode: the binary, the folder or script in
#             params.code_repo, rust/script/other, and the [enabled] key that turns it off ("bar.x" = [enabled.bar] x)
#   page      true = it has its own page; false = only a card in the list, which says it ships in swaydesk-desktop
#   with      on a card without a page: the id whose page it shares (screen recording is in the screenshot app)
# Filled in during 0.1.7 by whoever owns it; empty, the page shows "being written":
#   package   the package that installs it alone (from the 0.1.7 package split); the same name on Debian, Ubuntu and Arch
#   arch_with the packages added to the pacman line: what apt installs by Recommends and pacman doesn't (optdepends)
#   optional  packages worth adding on any distro (Debian Suggests), listed under the tabs
#   start     how to start it on plain Sway: the lines for ~/.config/sway/config
#   start_file  another file the start lines go in (default ~/.config/sway/config)
#   unit      true when start includes a snippet that runs the component as a systemd user unit (a note says so)
#   waybar    the Waybar module's name, swaydesk-<x>: custom/<name> from /usr/share/swaydesk/waybar/<name>.jsonc
# Per language ([components.pt-br], [components.en-us], [components.es]):
#   name, text (Markdown), keys (Markdown: how to open it), guide (a path in the Guide, with its anchor),
#   start_text (Markdown, in place of the start lines when there's nothing to add to the Sway config),
#   start_note (Markdown, under the start lines), arch_note (Markdown, under the Arch tab),
#   note (Markdown, on the page under the text), waybar_note (Markdown, under the Waybar module)
# [groups.<group>]: a metapackage that installs a whole section of the list (package), arch_with (its members'
#   optional dependencies, in one pacman --asdeps line), and per language its text

[[components]]
id = "network"
group = "bar"
icon = "bar"
shot = "network"
bin = "swaydesk-network-popup"
src = "rust/network-popup"
tech = "rust"
off = "bar.network"
page = true
package = "swaydesk-network"
arch_with = ["networkmanager"]
optional = []
start = ""
waybar = "swaydesk-network"
  [components.pt-br]
  name = "Rede"
  text = "Wi-Fi, cabo e VPN: liga e desliga, conecta, pede a senha e mostra os detalhes. Funciona com o NetworkManager e também com o iwd e o systemd-networkd (a VPN, só com o NetworkManager)."
  keys = "Clique no ícone de rede"
  guide = "guide/desktop/#a-barra"
  [components.en-us]
  name = "Network"
  text = "Wi-Fi, wired and VPN: turn them on and off, connect, enter the password and see the details. Works with NetworkManager, and also with iwd and systemd-networkd (VPN only with NetworkManager)."
  keys = "Click the network icon"
  guide = "guide/desktop/#the-bar"
  [components.es]
  name = "Red"
  text = "Wi-Fi, red cableada y VPN: actívalas y desactívalas, conéctate, escribe la contraseña y mira los detalles. Funciona con NetworkManager, y también con iwd y systemd-networkd (la VPN, solo con NetworkManager)."
