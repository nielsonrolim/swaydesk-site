[[components]]
id = "lock"
group = "session"
icon = "lock"
shot = "lock"
bin = "swaydesk-lock"
src = "rust/lock"
tech = "rust"
off = ""
page = true
package = "swaydesk-lock"
arch_with = ["swayidle", "libnotify"]
optional = []
start = "include /usr/share/swaydesk/sway/config.d/50-swaydesk-lock.conf"
  [components.pt-br]
  name = "Bloqueio de tela"
  text = "Hora, data e o campo de senha em todos os monitores, sobre o papel de parede desfocado. No Debian 13, cujo gtk4-layer-shell é anterior ao 1.2, a mesma tela de bloqueio roda na versão GTK 3."
  keys = "`Ctrl`+`Alt`+`L`; sozinho depois de 10 minutos"
  guide = "guide/desktop/#bloqueio-e-inatividade"
  start_note = "Ele adiciona o `Ctrl`+`Alt`+`L` e bloqueia depois de 10 minutos sem uso e antes de suspender, pelo swayidle, que vem junto com o bloqueio. Se a sua config já inicia o swayidle, fique com um só: acrescente `timeout 600 'swaydesk-lock' before-sleep 'swaydesk-lock'` à sua linha (com o `-w`, para bloquear antes de suspender) e, no lugar do include, ponha só o atalho, `bindsym Ctrl+Alt+l exec swaydesk-lock`."
  [components.en-us]
  name = "Lock screen"
  text = "Time, date and the password field on every monitor, over the blurred wallpaper. On Debian 13, whose gtk4-layer-shell is older than 1.2, the same lock screen runs in its GTK 3 version."
  keys = "`Ctrl`+`Alt`+`L`; on its own after 10 minutes"
  guide = "guide/desktop/#lock-screen-and-idle"
  start_note = "It adds `Ctrl`+`Alt`+`L` and locks after 10 minutes idle and before the computer sleeps, through swayidle, which comes with the lock. If your config already starts swayidle, keep only one: add `timeout 600 'swaydesk-lock' before-sleep 'swaydesk-lock'` to your own line (with `-w`, so it locks before the computer sleeps) and, instead of the include, add just the shortcut, `bindsym Ctrl+Alt+l exec swaydesk-lock`."
  [components.es]
  name = "Pantalla de bloqueo"
  text = "Hora, fecha y el campo de contraseña en cada monitor, sobre el fondo de pantalla difuminado. En Debian 13, cuyo gtk4-layer-shell es anterior a 1.2, la misma pantalla de bloqueo funciona en su versión GTK 3."
  keys = "`Ctrl`+`Alt`+`L`; sola después de 10 minutos"
  guide = "guide/desktop/#pantalla-de-bloqueo-e-inactividad"
  start_note = "Añade `Ctrl`+`Alt`+`L` y bloquea tras 10 minutos de inactividad y antes de suspender, con swayidle, que viene con el bloqueo. Si tu config ya inicia swayidle, deja solo uno: añade `timeout 600 'swaydesk-lock' before-sleep 'swaydesk-lock'` a tu propia línea (con `-w`, para que bloquee antes de suspender) y, en lugar del include, pon solo el atajo, `bindsym Ctrl+Alt+l exec swaydesk-lock`."

[[components]]
id = "greeter"
group = "session"
icon = "lock"
shot = "greeter"
bin = "swaydesk-greeter"
src = "rust/greeter"
tech = "rust"
off = ""
page = true
package = "swaydesk-greeter"
arch_with = ["gnome-keyring"]
optional = []
start = ""
  [components.pt-br]
  name = "Tela de login"
  text = "Uma tela de login sobre o greetd, com o mesmo visual da tela de bloqueio, em todas as distros suportadas, o Arch inclusive. Ela abre o chaveiro com a senha do login. A tela de login que você já usa também serve; sem uma, como numa instalação mínima ou de servidor, é ela que dá o login gráfico."
  keys = ""
  guide = "guide/first-steps/#a-tela-de-login-do-swaydesk"
  start_text = "Nada a acrescentar à config do Sway: a tela de login roda antes do Sway, pelo greetd.\n\n- **Debian e Ubuntu sem gerenciador de login:** ela aparece no próximo boot.\n- **Com outro gerenciador de login** (GDM, SDDM, LightDM), troque para o greetd e reinicie:\n\n  ```\n  sudo systemctl disable gdm3\n  sudo systemctl enable greetd\n  ```\n\n  Ponha `sddm` ou `lightdm` no lugar de `gdm3`, ou `gdm` no Arch. No Arch, o `sudo systemctl enable greetd` é preciso mesmo sem outro.\n- **Para voltar:** `sudo systemctl disable greetd`, ative de novo o anterior e reinicie."
  [components.en-us]
  name = "Login screen"
  text = "A login screen on top of greetd, with the same look as the lock screen, on every supported distro, Arch included. It unlocks the keyring with your login password. The login screen you already use works too; without one, as on a minimal or server install, this is what gives you a graphical login."
  keys = ""
  guide = "guide/first-steps/#the-swaydesk-login-screen"
  start_text = "Nothing to add to the Sway config: the login screen runs before Sway, through greetd.\n\n- **Debian and Ubuntu without a display manager:** it comes up at the next boot.\n- **With another display manager** (GDM, SDDM, LightDM), switch to greetd and reboot:\n\n  ```\n  sudo systemctl disable gdm3\n  sudo systemctl enable greetd\n  ```\n\n  Put `sddm` or `lightdm` in place of `gdm3`, or `gdm` on Arch. On Arch, `sudo systemctl enable greetd` is needed even without one.\n- **To go back:** `sudo systemctl disable greetd`, enable the old one again and reboot."
  [components.es]
  name = "Pantalla de inicio de sesión"
  text = "Una pantalla de inicio de sesión sobre greetd, con el mismo aspecto que la pantalla de bloqueo, en todas las distribuciones compatibles, Arch incluido. Desbloquea el llavero con tu contraseña de inicio de sesión. La pantalla de inicio de sesión que ya usas también funciona; sin una, como en una instalación mínima o de servidor, esta es la que te da un inicio de sesión gráfico."
  keys = ""
  guide = "guide/first-steps/#la-pantalla-de-inicio-de-sesión-de-swaydesk"
  start_text = "Nada que añadir a la config de Sway: la pantalla de inicio de sesión funciona antes de Sway, con greetd.\n\n- **Debian y Ubuntu sin gestor de inicio de sesión:** aparece en el próximo arranque.\n- **Con otro gestor de inicio de sesión** (GDM, SDDM, LightDM), cambia a greetd y reinicia:\n\n  ```\n  sudo systemctl disable gdm3\n  sudo systemctl enable greetd\n  ```\n\n  Pon `sddm` o `lightdm` en lugar de `gdm3`, o `gdm` en Arch. En Arch, `sudo systemctl enable greetd` hace falta incluso sin otro.\n- **Para volver:** `sudo systemctl disable greetd`, activa de nuevo el anterior y reinicia."

