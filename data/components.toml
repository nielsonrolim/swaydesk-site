  [components.pt-br]
  name = "Cor de destaque nos apps"
  text = "Leva a cor de destaque e o estilo claro ou escuro aos apps libadwaita e GTK 4 que leem a aparência do portal, pelo xdg-desktop-portal, em qualquer compositor. Só vale quando o `<desktop>-portals.conf` o escolhe para o `org.freedesktop.impl.portal.Settings`, como o desktop completo faz."
  keys = "Sozinho, pelo D-Bus"
  guide = "guide/config/"
  start_note = "Ele é o mesmo do desktop completo. Se o arquivo já existe, acrescente só a linha do `org.freedesktop.impl.portal.Settings` à seção `[preferred]`. O `default=gtk` usa o xdg-desktop-portal-gtk, e as linhas `wlr` (captura e gravação de tela), o xdg-desktop-portal-wlr. Vale no próximo login, ou depois de `systemctl --user restart xdg-desktop-portal`."
  [components.en-us]
  name = "Accent color in apps"
  text = "Brings the accent color and the light or dark style to the libadwaita and GTK 4 apps that read the portal's appearance settings, through xdg-desktop-portal, on any compositor. It applies only when your `<desktop>-portals.conf` picks it for `org.freedesktop.impl.portal.Settings`, as the full desktop does."
  keys = "On its own, through D-Bus"
  guide = "guide/config/"
  start_note = "It's the same file the full desktop ships. If you already have one, add only the `org.freedesktop.impl.portal.Settings` line to its `[preferred]` section. `default=gtk` uses xdg-desktop-portal-gtk, and the `wlr` lines (screenshots and screen sharing) xdg-desktop-portal-wlr. It applies at the next login, or after `systemctl --user restart xdg-desktop-portal`."
  [components.es]
  name = "Color de acento en las aplicaciones"
  text = "Lleva el color de acento y el estilo claro u oscuro a las aplicaciones libadwaita y GTK 4 que leen la apariencia del portal, con xdg-desktop-portal, en cualquier compositor. Solo se usa cuando tu `<desktop>-portals.conf` lo elige para `org.freedesktop.impl.portal.Settings`, como hace el escritorio completo."
  keys = "Solo, por D-Bus"
  guide = "guide/config/"
  start_note = "Es el mismo archivo del escritorio completo. Si ya tienes uno, añade solo la línea de `org.freedesktop.impl.portal.Settings` a su sección `[preferred]`. `default=gtk` usa xdg-desktop-portal-gtk, y las líneas `wlr` (capturas y compartir pantalla), xdg-desktop-portal-wlr. Se aplica en el próximo inicio de sesión, o tras `systemctl --user restart xdg-desktop-portal`."

[[components]]
id = "displays"
group = "apps"
icon = "theme"
shot = "displays"
bin = "swaydesk-displays"
src = "rust/displays"
tech = "rust"
off = "displays"
page = true
package = "swaydesk-displays"
arch_with = []
optional = []
start = "include /usr/share/swaydesk/sway/config.d/50-swaydesk-displays.conf"
unit = true
  [components.pt-br]
  name = "Telas"
  text = "As telas num mapa, para arrastar, com a resolução, a taxa, a escala e a rotação de cada uma, e se ela fica ligada. Uma mudança se desfaz sozinha em 15 segundos, se você não a mantiver. Cada conjunto de monitores guarda o seu layout, aplicado quando você pluga ou despluga uma tela, e a tela do notebook desliga com a tampa fechada e um monitor ligado. A chave desliga só esses perfis automáticos; o app continua."
  keys = "Na grade de apps"
  guide = "guide/config/#monitores"
  start_note = "O serviço aplica o layout salvo quando as telas mudam, e fechar ou abrir a tampa o aplica de novo."
  [components.en-us]
  name = "Displays"
  text = "Your screens on a map, to drag around, with each one's resolution, refresh rate, scale and rotation, and whether it's on. A change undoes itself after 15 seconds unless you keep it. Each set of monitors keeps its own layout, applied when you plug or unplug a screen, and the laptop screen turns off with the lid closed and an external monitor on. The key turns off only these automatic profiles; the app stays."
  keys = "In the app grid"
  guide = "guide/config/#displays"
  start_note = "The daemon applies the saved layout when screens change, and closing or opening the lid applies it again."
  [components.es]
  name = "Pantallas"
  text = "Tus pantallas en un mapa, para arrastrarlas, con la resolución, la frecuencia de actualización, la escala y la rotación de cada una, y si está encendida. Un cambio se deshace solo después de 15 segundos, a menos que lo conserves. Cada conjunto de monitores guarda su propia disposición, que se aplica cuando conectas o desconectas una pantalla, y la pantalla de la laptop se apaga con la tapa cerrada y un monitor externo encendido. La clave desactiva solo estos perfiles automáticos; la aplicación se queda."
  keys = "En la cuadrícula de aplicaciones"
  guide = "guide/config/#pantallas"
  start_note = "El servicio aplica la disposición guardada cuando cambian las pantallas, y cerrar o abrir la tapa la vuelve a aplicar."

[[components]]
id = "help"
group = "apps"
icon = "grid"
shot = "help"
bin = "swaydesk-help"
src = "rust/help"
tech = "rust"
off = ""
page = true
package = "swaydesk-help"
arch_with = ["swaydesk-lock"]
optional = []
start = "bindsym $mod+F1 exec swaydesk-help"
  [components.pt-br]
  name = "Ajuda"
  text = "Os atalhos do perfil em uso, com busca, lidos da própria configuração do Sway, e um cartão para cada parte do desktop, com o atalho e um botão que a abre. Nela você também troca o perfil de atalhos e abre o seu `50-local.conf` para editar."
  keys = "`Super`+`F1`; `Super`+`/`"
  guide = "shortcuts/"
  start_note = "Ele também abre pelo seu lançador. Ele lista os atalhos da sua própria config: um comentário `## descrição` acima de um dá o texto dele, `### Nome` os agrupa, e os outros mostram o comando. Os perfis de atalhos são da sessão do Swaydesk: na sua própria config, não use a troca de perfil dele."
  [components.en-us]
  name = "Help"
  text = "The shortcuts of the profile in use, with search, read from the Sway configuration itself, and a card for each part of the desktop, with its shortcut and a button that opens it. It's also where you switch the shortcut profile and open your `50-local.conf` to edit it."
  keys = "`Super`+`F1`; `Super`+`/`"
  guide = "shortcuts/"
  start_note = "It also opens from your launcher. It lists the bindings of your own config: a `## description` comment above one gives its text, `### Name` groups them, and the rest show their command. The shortcut profiles belong to the Swaydesk session: on your own config, don't use its profile switch."
  [components.es]
  name = "Ayuda"
  text = "Los atajos del perfil en uso, con búsqueda, leídos de la propia configuración de Sway, y una tarjeta para cada parte del escritorio, con su atajo y un botón que la abre. También es donde cambias el perfil de atajos y abres tu `50-local.conf` para editarlo."
  keys = "`Super`+`F1`; `Super`+`/`"
  guide = "shortcuts/"
  start_note = "También se abre desde tu lanzador. Lista los atajos de tu propia config: un comentario `## descripción` encima de uno da su texto, `### Nombre` los agrupa, y los demás muestran su comando. Los perfiles de atajos son de la sesión de Swaydesk: en tu propia config, no uses su cambio de perfil."

