  start_note = "It only acts on the first login on Debian 13, where gnome-keyring creates the keyring without publishing it: after a notice, it asks for your password once. Elsewhere it does nothing."
  [components.es]
  name = "Llavero"
  text = "gnome-keyring guarda las contraseñas de las aplicaciones y se desbloquea cuando inicias sesión. En Debian 13, el primer inicio de sesión de cada usuario muestra un aviso y pide la contraseña una vez; desde entonces, el llavero se desbloquea solo. En Ubuntu y Arch, no pide nada."
  keys = ""
  guide = "guide/desktop/#contraseñas-y-llavero"
  start_note = "Solo actúa en el primer inicio de sesión en Debian 13, donde gnome-keyring crea el llavero sin publicarlo: después de un aviso, pide tu contraseña una vez. En los demás casos, no hace nada."

