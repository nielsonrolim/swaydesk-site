  note = "También está en [Configuración](/es/components/settings/), como el panel **Apariencia**: la misma página, sin abrir otra ventana."

[[components]]
id = "portal"
group = "apps"
icon = "folder"
shot = ""
bin = "swaydesk-portal"
src = "rust/portal"
tech = "Rust"
off = ""
page = true
package = "swaydesk-portal"
arch_with = []
optional = []
  [components.pt-br]
  name = "Cor de destaque nos apps"
  text = "Entrega a cor de destaque do desktop aos apps que leem as configurações de aparência do portal, como os de libadwaita e GTK 4."
  start_text = "Se você já tem um `~/.config/xdg-desktop-portal/sway-portals.conf` seu, acrescente só `org.freedesktop.impl.portal.Settings=swaydesktop;gtk` à seção `[preferred]` dele. Senão, copie o arquivo que o swaydesk-portal instala (a cópia nunca substitui um arquivo que você já tem) e entre de novo:\n\n```\nmkdir -p ~/.config/xdg-desktop-portal\ncp --update=none /usr/share/swaydesk/xdg-desktop-portal/sway-portals.conf ~/.config/xdg-desktop-portal/\n```\n\nEle mantém as linhas do arquivo do próprio pacote do sway e acrescenta a da cor de destaque. Ele precisa do xdg-desktop-portal-gtk e do xdg-desktop-portal-wlr, e do `XDG_CURRENT_DESKTOP=sway` no ambiente do systemd do usuário, que o `50-systemd-user.conf` do próprio sway importa. Na sessão do Swaydesk, isso já vem pronto."
  features = [
    "Ele só responde com a cor de destaque (`org.freedesktop.appearance` `accent-color`); o claro ou escuro vem do portal do GTK.",
    "Os apps abertos pegam uma nova cor de destaque na hora, sem reiniciar.",
    "Ele abre sob demanda pelo D-Bus, continua rodando quando não enxerga o Sway e sai junto com o Sway.",
  ]
  keys = "Sozinho, pelo D-Bus"
  guide = "guide/config/"
  [components.en-us]
  name = "Accent color in apps"
  text = "Gives the desktop's accent color to apps that read the portal's appearance settings, such as libadwaita and GTK 4 apps."
  start_text = "If you already have your own `~/.config/xdg-desktop-portal/sway-portals.conf`, add only `org.freedesktop.impl.portal.Settings=swaydesktop;gtk` to its `[preferred]` section. Otherwise, copy the file swaydesk-portal ships (the copy never replaces a file you have), then log in again:\n\n```\nmkdir -p ~/.config/xdg-desktop-portal\ncp --update=none /usr/share/swaydesk/xdg-desktop-portal/sway-portals.conf ~/.config/xdg-desktop-portal/\n```\n\nIt keeps the lines of the sway package's own file and adds the accent one. It needs xdg-desktop-portal-gtk and xdg-desktop-portal-wlr, and `XDG_CURRENT_DESKTOP=sway` in the systemd user environment, which sway's own `50-systemd-user.conf` imports. In the Swaydesk session this is already in place."
  features = [
    "It answers only the accent color (`org.freedesktop.appearance` `accent-color`); light or dark comes from the GTK portal.",
    "Open apps take a new accent color right away, without restarting.",
    "It starts on demand through D-Bus, keeps running when it can't see Sway, and exits with Sway.",
  ]
  keys = "On its own, through D-Bus"
  guide = "guide/config/"
  [components.es]
  name = "Color de acento en las aplicaciones"
  text = "Da el color de acento del escritorio a las aplicaciones que leen los ajustes de apariencia del portal, como las de libadwaita y GTK 4."
  start_text = "Si ya tienes tu propio `~/.config/xdg-desktop-portal/sway-portals.conf`, añade solo `org.freedesktop.impl.portal.Settings=swaydesktop;gtk` a su sección `[preferred]`. Si no, copia el archivo que instala swaydesk-portal (la copia nunca reemplaza un archivo que ya tengas) y vuelve a iniciar sesión:\n\n```\nmkdir -p ~/.config/xdg-desktop-portal\ncp --update=none /usr/share/swaydesk/xdg-desktop-portal/sway-portals.conf ~/.config/xdg-desktop-portal/\n```\n\nConserva las líneas del archivo del propio paquete de sway y añade la del color de acento. Necesita xdg-desktop-portal-gtk y xdg-desktop-portal-wlr, y `XDG_CURRENT_DESKTOP=sway` en el entorno de systemd del usuario, que importa el `50-systemd-user.conf` del propio sway. En la sesión de Swaydesk, esto ya viene listo."
  features = [
    "Solo responde con el color de acento (`org.freedesktop.appearance` `accent-color`); el claro u oscuro viene del portal de GTK.",
    "Las aplicaciones abiertas toman un nuevo color de acento al momento, sin reiniciarse.",
    "Se inicia bajo demanda por D-Bus, sigue en marcha cuando no ve Sway y se cierra junto con Sway.",
  ]
  keys = "Solo, por D-Bus"
  guide = "guide/config/"

