{{ define "main" }}
<h1 class="prompt">{{ with .Params.prompt }}<span aria-hidden="true">{{ . }}</span><span class="sr-only">{{ $.Title }}</span>{{ else }}{{ .Title }}{{ end }}</h1>
<div class="content">{{ .Content }}</div>
<ol class="toc">
{{- range .Pages.ByWeight }}
<li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Description }}<p>{{ . }}</p>{{ end }}</li>
{{- end }}
</ol>
{{ end }}
